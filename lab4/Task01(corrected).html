<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grey Box Homepage Clone - Abdul Manan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Page Shell -->
    <div class="page">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <div class="logo-box">LOGO</div>
                <nav class="nav">
                    <div class="nav-box">Home</div>
                    <div class="nav-box">Explore</div>
                    <div class="nav-box">Articles</div>
                </nav>
            </div>
            <div class="header-right">
                <div class="search-box">Search</div>
                <div class="button-box">Login</div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <!-- Hero Section -->
            <section class="hero">
                <div class="hero-image">
                    IMAGE
                </div>
                <div class="hero-content">
                    <div class="title-box"></div>
                    <div class="text-box"></div>
                    <div class="small-box"></div>
                </div>
            </section>

            <!-- Content Grid -->
            <section class="content-grid">
                <!-- Card 1 -->
                <article class="card">
                    <div class="card-image">IMAGE</div>
                    <div class="card-content">
                        <div class="card-title"></div>
                        <div class="card-line"></div>
                        <div class="card-line short"></div>
                    </div>
                </article>

                <!-- Card 2 -->
                <article class="card">
                    <div class="card-image">IMAGE</div>
                    <div class="card-content">
                        <div class="card-title"></div>
                        <div class="card-line"></div>
                        <div class="card-line short"></div>
                    </div>
                </article>

                <!-- Card 3 -->
                <article class="card">
                    <div class="card-image">IMAGE</div>
                    <div class="card-content">
                        <div class="card-title"></div>
                        <div class="card-line"></div>
                        <div class="card-line short"></div>
                    </div>
                </article>

                <!-- Card 4 -->
                <article class="card">
                    <div class="card-image">IMAGE</div>
                    <div class="card-content">
                        <div class="card-title"></div>
                        <div class="card-line"></div>
                        <div class="card-line short"></div>
                    </div>
                </article>
            </section>

            <!-- Lower Section -->
            <section class="lower-section">
                <div class="lower-main">
                    <div class="section-heading"></div>
                    <div class="article-row">
                        <div class="article-box"></div>
                        <div class="article-box"></div>
                        <div class="article-box"></div>
                    </div>
                </div>
                <aside class="sidebar">
                    <div class="sidebar-heading"></div>
                    <div class="sidebar-item"></div>
                    <div class="sidebar-item"></div>
                    <div class="sidebar-item"></div>
                </aside>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-logo">LOGO</div>
            <div class="footer-links">
                <div class="footer-box"></div>
                <div class="footer-box"></div>
                <div class="footer-box"></div>
                <div class="footer-box"></div>
            </div>
        </footer>
    </div>
</body>
</html>
