<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CSS Grid — columns</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 1.5rem; font-family: system-ui, sans-serif; }
    h2 { font-size: 1rem; margin: 1.5rem 0 0.5rem; }
    .box { background: #ddd; padding: 1.5rem; text-align: center; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 1rem;
    }

    /* Other column recipes to try on .grid:
       grid-template-columns: 200px 1fr 200px;
       grid-template-columns: repeat(3, 1fr);
    */

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
  </style>
</head>
<body>
  <h1>CSS Grid</h1>

  <h2>Three equal columns (<code>1fr 1fr 1fr</code>)</h2>
  <div class="grid">
    <div class="box">1</div>
    <div class="box">2</div>
    <div class="box">3</div>
  </div>

  <h2>Responsive gallery — resize me (<code>auto-fit</code> + <code>minmax</code>)</h2>
  <div class="gallery">
    <div class="box">A</div>
    <div class="box">B</div>
    <div class="box">C</div>
    <div class="box">D</div>
    <div class="box">E</div>
    <div class="box">F</div>
  </div>
</body>
</html>
